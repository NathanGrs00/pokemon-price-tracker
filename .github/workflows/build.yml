name: Build

# Every push and pull request: run the tests and build the APK.
# To publish a GitHub release with the APK, either push a version tag (for example v1.0.0)
# or open Actions > Build > "Run workflow" and type the version.
on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example v1.0.0
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk PokemonPriceTracker-$VERSION.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PokemonPriceTracker-apk
          path: PokemonPriceTracker-*.apk

      - name: Publish release
        if: env.VERSION != 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Pokemon Price Tracker ${{ env.VERSION }}
          files: PokemonPriceTracker-*.apk
          generate_release_notes: true
